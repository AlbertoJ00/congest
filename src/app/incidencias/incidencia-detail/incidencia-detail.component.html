<app-header activeSection="Incidencias"></app-header><main class="content-main" *ngIf="incidencia"><a routerLink="/incidencias">← Volver</a><h1>{{ incidencia.titulo }}</h1><p>{{ incidencia.descripcion }}</p><dl><dt>Ubicación</dt><dd>{{ incidencia.ubicacion }}</dd><dt>Severidad</dt><dd>{{ incidencia.severidad }}</dd><dt>Estado</dt><dd>{{ incidencia.estado }}</dd><dt>Reportado por</dt><dd>{{ incidencia.reportadoPor || '—' }}</dd></dl></main>
