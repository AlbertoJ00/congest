<div class="entity-modal__backdrop" *ngIf="open" (click)="closeModal()">
  <div class="entity-modal" (click)="$event.stopPropagation()">
    <div class="entity-modal__header">
      <div>
        <h3 class="entity-modal__title">{{ title }}</h3>
        <p class="entity-modal__subtitle">{{ subtitle }}</p>
      </div>
      <button type="button" class="entity-modal__close" (click)="closeModal()" aria-label="Cerrar modal">
        ×
      </button>
    </div>

    <form [formGroup]="entityForm" class="entity-modal__form" (ngSubmit)="submit()">
      <ng-container *ngIf="mode === 'inquilino'; else nonTenantForms">
        <div class="entity-modal__grid">
          <div class="entity-modal__field">
            <label>Tipo de documento</label>
            <select class="form-input" formControlName="tipoDocumento">
              <option value="Cedula">Cedula</option>
              <option value="Pasaporte">Pasaporte</option>
              <option value="RNC">RNC</option>
            </select>
          </div>

          <div class="entity-modal__field">
            <label>Numero documento</label>
            <input type="text" class="form-input" formControlName="documento">
          </div>

          <div class="entity-modal__field">
            <label>Nombres</label>
            <input type="text" class="form-input" formControlName="nombres">
          </div>

          <div class="entity-modal__field">
            <label>Apellidos</label>
            <input type="text" class="form-input" formControlName="apellidos">
          </div>

          <div class="entity-modal__field">
            <label>Correo electronico</label>
            <input type="email" class="form-input" formControlName="correoElectronico">
          </div>

          <div class="entity-modal__field">
            <label>Numero de celular</label>
            <input type="text" class="form-input" formControlName="celular">
          </div>

          <div class="entity-modal__field">
            <label>Telefono adicional</label>
            <input type="text" class="form-input" formControlName="telefonoAdicional">
          </div>

          <div class="entity-modal__field">
            <label>Tipo de sangre</label>
            <input type="text" class="form-input" formControlName="tipoSangre">
          </div>

          <div class="entity-modal__field">
            <label>Estado civil</label>
            <input type="text" class="form-input" formControlName="estadoCivil">
          </div>

          <div class="entity-modal__field entity-modal__field--full entity-modal__field--checkbox">
            <label class="entity-modal__checkbox">
              <input type="checkbox" formControlName="esPrincipal">
              <span>Es inquilino principal</span>
            </label>
            <span class="entity-modal__hint">Marca esta opción si este registro corresponde al titular principal.</span>
          </div>

          <div class="entity-modal__field entity-modal__field--full">
            <label>Condominio</label>
            <select class="form-input" formControlName="condominioId">
              <option [ngValue]="''" disabled>Selecciona un condominio</option>
              <option *ngFor="let condominio of condominios" [ngValue]="condominio.id">
                {{ condominio.nombre }} — {{ condominio.sector }}
              </option>
            </select>
          </div>
        </div>
      </ng-container>

      <ng-template #nonTenantForms>
        <ng-container *ngIf="mode === 'reporte'; else nonReportForms">
          <div class="entity-modal__grid">
            <div class="entity-modal__field">
              <label>Prioridad</label>
              <select class="form-input" formControlName="prioridad">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
              </select>
            </div>

            <div class="entity-modal__field">
              <label>Condominio</label>
              <select class="form-input" formControlName="condominioId">
                <option [ngValue]="''" disabled>Selecciona un condominio</option>
                <option *ngFor="let condominio of condominios" [ngValue]="condominio.id">{{ condominio.nombre }}</option>
              </select>
            </div>

            <div class="entity-modal__field">
              <label>Estado</label>
              <select class="form-input" formControlName="estado">
                <option value="En proceso">En proceso</option>
                <option value="Asignado">Asignado</option>
                <option value="Resuelto">Resuelto</option>
              </select>
            </div>

            <div class="entity-modal__field entity-modal__field--full">
              <label>Concepto</label>
              <input type="text" class="form-input" formControlName="concepto">
            </div>
          </div>
        </ng-container>
      </ng-template>

      <ng-template #nonReportForms>
        <ng-container *ngIf="mode === 'pago'; else condominioForm">
          <ng-container *ngTemplateOutlet="pagoForm"></ng-container>
        </ng-container>
      </ng-template>

      <ng-template #pagoForm>
        <div class="entity-modal__grid">
          <div class="entity-modal__field entity-modal__field--full">
            <label>Condominio</label>
            <select class="form-input" formControlName="condominioId">
              <option [ngValue]="''" disabled>Selecciona un condominio</option>
              <option *ngFor="let condominio of condominios" [ngValue]="condominio.id">{{ condominio.nombre }}</option>
            </select>
          </div>

          <div class="entity-modal__field">
            <label>Tipo</label>
            <select class="form-input" formControlName="tipo">
              <option value="Ingreso">Ingreso</option>
              <option value="Gasto">Gasto</option>
            </select>
          </div>

          <div class="entity-modal__field">
            <label>Categoria</label>
            <select class="form-input" formControlName="categoria">
              <option value="Cuotas">Cuotas</option>
              <option value="Servicios">Servicios</option>
              <option value="Mantenimiento">Mantenimiento</option>
            </select>
          </div>

          <div class="entity-modal__field">
            <label>Metodo</label>
            <select class="form-input" formControlName="metodo">
              <option value="Efectivo">Efectivo</option>
              <option value="Transferencia">Transferencia</option>
              <option value="Tarjeta">Tarjeta</option>
            </select>
          </div>

          <div class="entity-modal__field">
            <label>Monto</label>
            <input type="number" class="form-input" formControlName="monto">
          </div>

          <div class="entity-modal__field entity-modal__field--full">
            <label>Concepto</label>
            <input type="text" class="form-input" formControlName="concepto">
          </div>
        </div>
      </ng-template>

      <ng-template #condominioForm>
        <div class="entity-modal__grid">
          <div class="entity-modal__field entity-modal__field--full">
            <label>Nombre del condominio</label>
            <input type="text" class="form-input" formControlName="nombre">
          </div>

          <div class="entity-modal__field">
            <label>Ciudad</label>
            <input type="text" class="form-input" formControlName="ciudad">
          </div>

          <div class="entity-modal__field">
            <label>Sector</label>
            <input type="text" class="form-input" formControlName="sector">
          </div>

          <div class="entity-modal__field">
            <label>Precio mensual</label>
            <input type="number" class="form-input" formControlName="precio">
          </div>

          <div class="entity-modal__field">
            <label>Cuartos</label>
            <input type="number" class="form-input" formControlName="cuartos">
          </div>

          <div class="entity-modal__field">
            <label>Baños</label>
            <input type="number" class="form-input" formControlName="banos">
          </div>

          <div class="entity-modal__field">
            <label>Capacidad</label>
            <input type="number" class="form-input" formControlName="capacidad">
          </div>

          <div class="entity-modal__field entity-modal__field--full">
            <label>Descripción</label>
            <textarea class="form-input" formControlName="descripcion" rows="3"></textarea>
          </div>

          <div class="entity-modal__field entity-modal__field--full">
            <label>Imagen Principal</label>
            <input type="file" class="form-input" accept="image/*" (change)="onMainImageChange($event)">
            <input type="hidden" formControlName="imagen">
            <div *ngIf="entityForm.get('imagen')?.value" style="margin-top: 8px;">
              <img [src]="entityForm.get('imagen')?.value" alt="Vista previa principal" style="max-height: 120px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover;">
            </div>
          </div>

          <div class="entity-modal__field entity-modal__field--full">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label style="margin-bottom: 0;">Imágenes Adicionales</label>
              <button type="button" class="entity-modal__secondary" style="padding: 4px 8px; font-size: 12px; height: auto;" (click)="addImagenAdicional()">+ Añadir</button>
            </div>
            <div formArrayName="imagenesAdicionales">
              <div *ngFor="let control of imagenesAdicionales.controls; let i=index" style="display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start;">
                <div style="flex: 1;">
                  <input type="file" class="form-input" accept="image/*" (change)="onAdditionalImageChange($event, i)">
                  <input type="hidden" [formControlName]="i">
                  <div *ngIf="control.value" style="margin-top: 8px;">
                    <img [src]="control.value" alt="Vista previa adicional" style="max-height: 80px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover;">
                  </div>
                </div>
                <button type="button" class="entity-modal__secondary" style="padding: 6px 12px; height: auto; margin-top: 2px;" title="Quitar imagen" (click)="removeImagenAdicional(i)">✕</button>
              </div>
            </div>
          </div>

          <div class="entity-modal__field entity-modal__field--full" *ngIf="propietarios.length">
            <label>Propietario responsable</label>
            <select class="form-input" formControlName="propietarioId">
              <option [ngValue]="''" disabled>Selecciona un propietario</option>
              <option *ngFor="let propietario of propietarios" [ngValue]="propietario.id">
                {{ propietario.nombre }} {{ propietario.apellido }} — {{ propietario.email }}
              </option>
            </select>
          </div>
        </div>
      </ng-template>

      <div *ngIf="fileUploadError" style="color: #ef4444; font-size: 13px; margin-bottom: 16px; padding: 0 24px; font-weight: 500;">
        {{ fileUploadError }}
      </div>

      <div class="entity-modal__actions">
        <button type="button" class="entity-modal__secondary" (click)="closeModal()">Cancelar</button>
        <button type="submit" class="btn-primary">{{ primaryButtonLabel }}</button>
      </div>
    </form>
  </div>
</div>
