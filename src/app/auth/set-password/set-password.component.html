<main class="login-page">
  <section class="login-page__form-side">
    <div class="login-page__form-container">
      <h1 class="login-page__title">Establecer contraseña</h1>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-page__form">
        <input class="form-input" type="password" placeholder="Contraseña" formControlName="password">
        <input class="form-input" type="password" placeholder="Confirmar contraseña" formControlName="confirm">
        <p *ngIf="message">{{ message }}</p>
        <button class="btn-primary">Establecer contraseña</button>
      </form>
    </div>
  </section>
</main>
