<main class="login-page">
  <!-- Imagen a la izquierda, igual que la pantalla de inicio de sesión -->
  <div class="login-page__image-side">
    <div class="login-page__image-container">
      <div class="login-page__image-placeholder">
        <img src="/img/register.jpg" alt="Vivienda" class="login-image">
      </div>
    </div>
  </div>

  <section class="login-page__form-side">
    <div class="login-page__logo">
      <img src="/img/logo.png" alt="Congest" class="login-page__logo-image">
    </div>

    <div class="login-page__form-container">
      <h1 class="login-page__title">Crear cuenta de propietario</h1>
      <p class="login-page__subtitle">Un administrador deberá asignarte tus condominios.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-page__form">
        <div class="login-page__field">
          <label class="form-label" for="nombre">Nombre</label>
          <input id="nombre" class="form-input" placeholder="Tu nombre" formControlName="nombre" autocomplete="given-name">
        </div>

        <div class="login-page__field">
          <label class="form-label" for="apellido">Apellido</label>
          <input id="apellido" class="form-input" placeholder="Tu apellido" formControlName="apellido" autocomplete="family-name">
        </div>

        <div class="login-page__field">
          <label class="form-label" for="email">Correo</label>
          <input id="email" class="form-input" type="email" placeholder="correo@ejemplo.com" formControlName="email" autocomplete="email">
        </div>

        <div class="login-page__field">
          <label class="form-label" for="password">Contraseña</label>
          <input id="password" class="form-input" type="password" placeholder="Mínimo 8 caracteres" formControlName="password" autocomplete="new-password">
        </div>

        <div class="login-page__error login-page__error--general" *ngIf="message">
          {{ message }}
        </div>

        <button type="submit" class="btn-primary login-page__submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Creando cuenta...' : 'Registrarme como propietario' }}
        </button>
      </form>

      <p class="login-page__register">
        ¿Ya tienes una cuenta? <a routerLink="/login" class="login-page__register-link">Inicia sesión</a>
      </p>
    </div>
  </section>
</main>
