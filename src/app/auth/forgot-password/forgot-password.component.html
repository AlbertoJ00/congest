<main class="login-page"><section class="login-page__form-side"><div class="login-page__form-container"><h1 class="login-page__title">Recuperar contraseña</h1><form [formGroup]="form" (ngSubmit)="submit()" class="login-page__form"><input class="form-input" type="email" placeholder="Correo" formControlName="email"><button class="btn-primary">Enviar instrucciones</button></form><p *ngIf="message">{{ message }}</p><a routerLink="/login">Volver a iniciar sesión</a></div></section></main>
