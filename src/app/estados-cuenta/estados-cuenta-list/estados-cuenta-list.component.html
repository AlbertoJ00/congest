<app-header activeSection="Estados de Cuenta"></app-header><main class="content-main"><div class="page-header"><div><h1 class="page-header__title">Estados de cuenta</h1><p class="page-header__subtitle">Historial de cuotas por inquilino</p></div></div><div class="table-container"><table class="table"><thead><tr><th>Referencia</th><th>Inquilino</th><th>Condominio</th><th>Cuota</th><th>Estado</th><th></th></tr></thead><tbody><tr *ngFor="let item of estados"><td>{{ item.numero }}</td><td>{{ item.inquilinoNombre }}</td><td>{{ item.condominioNombre }}</td><td>${{ item.cuota | number }}</td><td>{{ item.estado }}</td><td><a [routerLink]="[item.id]">Ver detalle</a></td></tr></tbody></table></div></main>
