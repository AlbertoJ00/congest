<app-header activeSection="Estados de Cuenta"></app-header><main class="content-main" *ngIf="estado"><a routerLink="/estados-cuenta">← Volver</a><h1>Estado de cuenta {{ estado.numero }}</h1><dl><dt>Inquilino</dt><dd>{{ estado.inquilinoNombre }}</dd><dt>Condominio</dt><dd>{{ estado.condominioNombre }}</dd><dt>Periodo</dt><dd>{{ estado.mes }} {{ estado.anio }}</dd><dt>Cuota</dt><dd>${{ estado.cuota | number }}</dd><dt>Estado</dt><dd>{{ estado.estado }}</dd></dl></main>
